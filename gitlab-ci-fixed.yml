image: node:20-alpine

stages:
  - bootstrap

bootstrap_source:
  stage: bootstrap
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl unzip git
  script:
    - |
      curl --fail --location --retry 3 'https://40k-tactics.pages.dev/bootstrap/40k-tactics-gitlab-source.zip' --output /tmp/40k-source.zip
      mkdir -p /tmp/40k-source
      unzip -q /tmp/40k-source.zip -d /tmp/40k-source
      find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      cp -a /tmp/40k-source/. .
      npm test
      npm run build
      git config user.name '40K Tactics Recovery'
      git config user.email 'recovery-bot@users.noreply.gitlab.com'
      git add -A
      git commit -m 'Recover 40K Tactics V2 source after GitHub suspension'
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${CI_DEFAULT_BRANCH}"
