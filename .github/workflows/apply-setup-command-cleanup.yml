name: Apply setup and command cleanup

on:
  push:
    branches:
      - feature/setup-command-cleanup
    paths:
      - .github/workflows/apply-setup-command-cleanup.yml
      - scripts/apply-setup-command-cleanup.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/setup-command-cleanup
      - name: Apply focused UI changes
        run: node scripts/apply-setup-command-cleanup.mjs
      - name: Commit changes
        run: |
          git config user.name "40K Tactics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/rules/event-preparation.js src/engine/state-transitions.js src/ui/event-preparation-screen.js src/ui/battle-setup-screen.js src/ui/deployment-screen.js src/ui/command-screen.js tests/ui/setup-command-cleanup.test.js
          git diff --cached --check
          git commit -m "Streamline setup and command phase UI"
          git push origin HEAD:feature/setup-command-cleanup
