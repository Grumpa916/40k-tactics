name: Apply movement action undo
on:
  push:
    branches: [feature/movement-action-undo]
    paths:
      - scripts/apply-movement-action-undo.mjs
      - .github/workflows/apply-movement-action-undo.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/movement-action-undo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-movement-action-undo.mjs
      - run: npm test
      - run: |
          git config user.name '40K Tactics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/commands/game-commands.js src/engine/register-core-commands.js src/engine/movement-transitions.js src/ui/movement-screen.js tests/engine/movement-action-undo.test.js
          git commit -m 'Make movement reset undo the recorded action' || exit 0
          git push
