name: Apply army battle-shock and layout preview changes

on:
  push:
    branches:
      - feature/army-battleshock-layout-previews
    paths:
      - .github/workflows/apply-army-layout-preview.yml
      - scripts/apply-army-layout-preview.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/army-battleshock-layout-previews
      - name: Apply focused UI changes
        run: node scripts/apply-army-layout-preview.mjs
      - name: Commit UI changes
        run: |
          git config user.name "40K Tactics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/army-unit-summary.js src/ui/battle-context-panels.js src/ui/battle-setup-screen.js src/ui/styles/prototype-workspace.css tests/ui/prototype-interface-restoration.test.js
          git diff --cached --check
          git commit -m "Move Battle-shock toggle and add layout previews"
          git push origin HEAD:feature/army-battleshock-layout-previews
