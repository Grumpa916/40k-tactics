name: Apply command map CP timers layout
on:
  push:
    branches:
      - feature/command-map-cp-timers-layout
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-map-cp-timers-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply requested changes
        run: node scripts/apply-command-map-cp-timers-layout.mjs
      - name: Test
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name '40K Tactics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests
          git commit -m 'Improve command map, CP gains, timers, and setup layout'
          git push origin HEAD:feature/command-map-cp-timers-layout
