name: Fix active player command display
on:
  push:
    branches: [feature/setup-command-cleanup]
    paths:
      - .github/workflows/fix-command-active-player.yml
      - scripts/fix-command-active-player.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/setup-command-cleanup
      - run: node scripts/fix-command-active-player.mjs
      - run: |
          git config user.name "40K Tactics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/command-screen.js
          git diff --cached --check
          git commit -m "Use active player throughout Command phase"
          git push origin HEAD:feature/setup-command-cleanup
