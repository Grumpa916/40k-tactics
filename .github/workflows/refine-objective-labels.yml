name: Refine objective labels
on:
  push:
    branches: [feature/scoreboard-objective-map-controls]
    paths:
      - .github/workflows/refine-objective-labels.yml
      - scripts/refine-objective-labels.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scoreboard-objective-map-controls
      - run: node scripts/refine-objective-labels.mjs
      - run: |
          git config user.name "40K Tactics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/battlefield-map.js src/ui/command-screen.js
          git diff --cached --check
          git commit -m "Refine live objective labels and perspective"
          git push origin HEAD:feature/scoreboard-objective-map-controls
