name: 40K Tactics V2 Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run tests
        run: npm test

  terrain-rollout-diagnostic:
    name: terrain pages ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 15-22
            pattern: 'page (15|16|17|18|19|20|21|22)'
          - label: 23-30
            pattern: 'page (23|24|25|26|27|28|29|30)'
          - label: 31-38
            pattern: 'page (31|32|33|34|35|36|37|38)'
          - label: 39-46
            pattern: 'page (39|40|41|42|43|44|45|46)'
          - label: 47-53
            pattern: 'page (47|48|49|50|51|52|53)|final Sabotage'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run terrain rollout diagnostics
        run: node --test --test-name-pattern="${{ matrix.pattern }}" tests/data/event-companion-placement-guides-extended.test.js

  suite-diagnostic:
    name: suite ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: data
            command: node --test tests/data/*.test.js
          - label: ui
            command: node --test tests/ui/*.test.js
          - label: engine
            command: node --test tests/engine/*.test.js
          - label: rules
            command: node --test tests/rules/*.test.js
          - label: application-state-other
            command: node --test tests/application/*.test.js tests/state/*.test.js tests/persistence/*.test.js tests/events/*.test.js tests/scenarios/*.test.js tests/commands/*.test.js
          - label: legacy-top-level
            command: node --test test/*.test.js
          - label: src-tests
            command: find src -name '*.test.js' -print0 | xargs -0 node --test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run grouped diagnostics
        run: ${{ matrix.command }}
