name: Diagnostic final checkpoint
on:
  push:
jobs:
  ui-a-m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/ui/[a-m]*.test.js
  ui-n-z:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/ui/[n-z]*.test.js
