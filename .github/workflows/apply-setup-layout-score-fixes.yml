name: Apply setup layout score fixes
on:
  push:
    branches: [feature/setup-layout-score-adjust-fixes]
    paths:
      - scripts/apply-setup-layout-score-fixes.mjs
      - .github/workflows/apply-setup-layout-score-fixes.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/setup-layout-score-adjust-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-setup-layout-score-fixes.mjs
      - run: npm test
      - run: |
          git config user.name '40K Tactics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui/army-selection-panel.js src/ui/battle-setup-screen.js src/ui/battle-shell.js src/ui/styles/prototype-workspace.css tests/ui/scoreboard-objective-controls.test.js
          git commit -m 'Fix setup visuals and score adjustment overlay' || exit 0
          git push
