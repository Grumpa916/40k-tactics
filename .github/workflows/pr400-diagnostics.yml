name: PR 400 Focused Diagnostics

on:
  push:
    branches:
      - feature/movement-calistus-refinement

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run UI tests
        id: ui
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t test_files < <(find tests/ui -type f -name '*.test.js' | sort)
          set +e
          node --test "${test_files[@]}" > pr400-ui-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload UI output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr400-ui-test-output
          path: pr400-ui-output.txt
      - name: Mark diagnostic result
        if: always()
        shell: bash
        run: |
          cat pr400-ui-output.txt
          exit "${{ steps.ui.outputs.exit_code }}"
