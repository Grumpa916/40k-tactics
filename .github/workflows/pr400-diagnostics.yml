name: PR 400 Focused Diagnostics

on:
  push:
    branches:
      - feature/movement-calistus-refinement

jobs:
  test-group:
    name: test-${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - application
          - build
          - data
          - engine
          - rules
          - state
          - ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test group
        shell: bash
        run: |
          mapfile -t test_files < <(find "tests/${{ matrix.group }}" -type f -name '*.test.js' | sort)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found for ${{ matrix.group }}"
            exit 0
          fi
          node --test "${test_files[@]}"
