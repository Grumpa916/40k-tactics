name: Apply requested UI cleanup patch

on:
  push:
    branches:
      - feature/ui-cleanup-charge-scoring

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-cleanup-charge-scoring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply requested changes
        run: python scripts/apply_ui_cleanup_charge_scoring.py
      - name: Verify
        run: npm run verify
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify live UI and add charge decline scoring choices'
          git push origin HEAD:feature/ui-cleanup-charge-scoring
