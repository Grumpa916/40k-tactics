name: Apply movement map focus
on:
  push:
    branches: [feature/movement-map-focus-and-reset]
    paths:
      - scripts/apply-movement-map-focus.mjs
      - .github/workflows/apply-movement-map-focus.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/movement-map-focus-and-reset
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-movement-map-focus.mjs
      - run: npm test
      - run: |
          git config user.name '40K Tactics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ui/phase-progression-panel.js src/ui/live-map-view.js src/ui/movement-screen.js src/ui/styles/prototype-workspace.css
          git commit -m 'Improve movement battlefield controls and reset' || exit 0
          git push
