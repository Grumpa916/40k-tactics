name: Diagnostic actionable checkpoints

on:
  push:

jobs:
  unstoppable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern='Unstoppable' tests/application/actionable-scoring-checkpoints.test.js

  punishment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern='Punishment' tests/application/actionable-scoring-checkpoints.test.js

  consecrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern='Consecrate' tests/application/actionable-scoring-checkpoints.test.js

  legacy-primary-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern='primary scores' tests/ui/checkpoint-inline-scoring.test.js

  legacy-inline-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern='inline form' tests/ui/checkpoint-inline-scoring.test.js

  legacy-destruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern='destruction evidence' tests/ui/checkpoint-inline-scoring.test.js
