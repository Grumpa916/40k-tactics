name: Apply scoreboard objective controls
on:
  push:
    branches: [feature/scoreboard-objective-map-controls]
    paths:
      - .github/workflows/apply-scoreboard-objective-controls.yml
      - scripts/apply-scoreboard-objective-controls.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scoreboard-objective-map-controls
      - run: node scripts/apply-scoreboard-objective-controls.mjs
      - run: |
          git config user.name "40K Tactics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/command-screen.js src/ui/battlefield-map.js src/ui/battle-shell.js src/engine/battlefield-map-transitions.js tests/ui/scoreboard-objective-controls.test.js
          git diff --cached --check
          git commit -m "Move score adjustments to scoreboard and make objectives interactive"
          git push origin HEAD:feature/scoreboard-objective-map-controls
