name: Fix setup and command cleanup

on:
  push:
    branches:
      - feature/setup-command-cleanup
    paths:
      - .github/workflows/fix-setup-command-cleanup.yml
      - scripts/fix-setup-command-cleanup.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/setup-command-cleanup
      - run: node scripts/fix-setup-command-cleanup.mjs
      - run: |
          git config user.name "40K Tactics Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/rules/event-preparation.js src/engine/state-transitions.js src/ui/event-preparation-screen.js tests/ui/setup-command-cleanup.test.js
          git diff --cached --check
          git commit -m "Preserve formation rules while skipping setup page"
          git push origin HEAD:feature/setup-command-cleanup
