name: Apply iPad phase layout scoring fixes
on:
  push:
    branches:
      - fix/ipad-phase-layout-scoring
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-phase-layout-scoring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply requested UI fixes
        run: node scripts/apply-ipad-phase-layout-scoring.mjs
      - name: Test
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name '40K Tactics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests
          git commit -m 'Refine iPad deployment scoring movement and shooting layouts'
          git push origin HEAD:fix/ipad-phase-layout-scoring
