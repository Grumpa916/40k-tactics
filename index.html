<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40K Tactics — Fight Phase</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #0b0d10;
      color: #f2f3f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b0d10; }
    button { font: inherit; }
    .fight-screen { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
    .fight-header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .fight-kicker { font-size: 11px; letter-spacing: .14em; opacity: .55; }
    h1 { margin: 3px 0 2px; font-size: clamp(30px, 7vw, 36px); }
    .fight-header p { margin: 0; opacity: .6; }
    .fight-status { border: 1px solid #353a42; border-radius: 999px; padding: 8px 12px; font-size: 12px; white-space: nowrap; }
    .fight-note { margin: 18px 0; padding: 11px 13px; border-radius: 10px; background: #14181d; color: #bfc5cd; font-size: 13px; line-height: 1.4; }
    .fight-section { margin-top: 20px; }
    .fight-section__heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .fight-section h2 { margin: 0; font-size: 16px; }
    .fight-section__hint, .fight-section__empty { font-size: 11px; opacity: .5; }
    .fight-candidates { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .fight-unit { text-align: left; padding: 13px; border: 1px solid #343a43; border-radius: 11px; background: #171b21; color: inherit; cursor: pointer; display: grid; gap: 4px; min-height: 88px; transition: border-color .12s ease, transform .12s ease; }
    .fight-unit:hover:not(:disabled), .fight-unit:focus-visible { transform: translateY(-1px); border-color: #66707e; }
    .fight-unit:disabled { cursor: not-allowed; opacity: .3; }
    .fight-unit--self { border-left: 3px solid #72839b; }
    .fight-unit--opponent { border-left: 3px solid #9b8272; }
    .fight-unit__name { font-weight: 700; }
    .fight-unit__owner { font-size: 12px; opacity: .65; }
    .fight-unit__action { margin-top: auto; font-size: 11px; opacity: .45; }
    .fight-attack-entry { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; align-items: end; }
    .fight-attack-entry label { display: grid; gap: 5px; font-size: 11px; opacity: .65; }
    .fight-attack-entry select { width: 100%; min-height: 42px; padding: 0 10px; border: 1px solid #343a43; border-radius: 9px; background: #171b21; color: inherit; font: inherit; }
    .fight-attack-entry button { min-height: 42px; padding: 0 14px; border: 0; border-radius: 9px; background: #e8ebef; color: #0b0d10; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .fight-attack-entry button:disabled { cursor: not-allowed; opacity: .3; }
    .fight-history { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .fight-history__item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid #272c33; border-radius: 9px; background: #111419; }
    .fight-history__number { opacity: .45; font-variant-numeric: tabular-nums; font-size: 12px; }
    .fight-history__main { display: grid; gap: 2px; min-width: 0; }
    .fight-history__main strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fight-history__main span, .fight-history__stats { font-size: 11px; opacity: .55; }
    .fight-history__empty { padding: 12px 0; opacity: .45; font-size: 13px; }
    .fight-footer { margin-top: 24px; display: flex; justify-content: flex-end; }
    .fight-complete { min-height: 42px; padding: 0 17px; border: 0; border-radius: 9px; background: #e8ebef; color: #0b0d10; font-weight: 700; cursor: pointer; }
    .fight-complete:disabled { cursor: not-allowed; opacity: .3; }
    @media (max-width: 700px) {
      .fight-header { flex-direction: column; }
      .fight-status { align-self: flex-start; }
      .fight-attack-entry { grid-template-columns: 1fr 1fr; }
      .fight-attack-entry label:first-child { grid-column: 1 / -1; }
      .fight-attack-entry button { grid-column: 1 / -1; }
    }
    @media (max-width: 480px) {
      .fight-screen { padding: 18px 12px 32px; }
      .fight-note { font-size: 12px; }
      .fight-candidates { grid-template-columns: 1fr; }
      .fight-attack-entry { grid-template-columns: 1fr; }
      .fight-attack-entry label:first-child, .fight-attack-entry button { grid-column: auto; }
      .fight-history__item { grid-template-columns: 24px 1fr; }
      .fight-history__stats { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div id="fight-app"></div>
  <script type="module" src="./src/ui/fight-demo.js"></script>
</body>
</html>
