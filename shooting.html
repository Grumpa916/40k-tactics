<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>40K Tactics — Shooting Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#121417;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shoot-screen{max-width:1180px;margin:0 auto;padding:22px}
header,.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}header{background:#fff;border:1px solid #d9dce1;border-radius:12px;padding:18px 20px;margin-bottom:14px}h1{margin:4px 0;font-size:28px}.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:#666}header p{margin:0;color:#666}.note{background:#fff;border:1px solid #d9dce1;border-radius:10px;padding:12px 14px;color:#50545a;font-size:14px}
section{background:#fff;border:1px solid #d9dce1;border-radius:12px;padding:16px;margin-top:14px}.heading{margin-bottom:12px}.heading h2{margin:0;font-size:16px}.heading span{font-size:12px;color:#6b7077}.candidates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shoot-unit{min-height:76px;text-align:left;padding:12px;border:1px solid #cfd3d8;border-radius:9px;background:#fafbfc;cursor:pointer}.shoot-unit strong,.shoot-unit span,.shoot-unit small{display:block}.shoot-unit span,.shoot-unit small{margin-top:4px;color:#666;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.grid section{margin-top:14px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.controls label{font-size:12px;font-weight:700}.controls select,.controls button{width:100%;margin-top:6px;min-height:40px;padding:0 9px;border:1px solid #c7cbd0;border-radius:8px;background:#fff}.controls button,.complete{font-weight:800;cursor:pointer}.history{margin:0;padding-left:24px}.history li{padding:7px 0}.history span{display:block;color:#666;font-size:12px;margin-top:2px}footer{display:flex;justify-content:flex-end;padding:16px 0}.complete{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:#e8ebef;color:#0b0d10}.complete:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:800px){.grid{grid-template-columns:1fr}.candidates{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.candidates{grid-template-columns:1fr}.controls{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div id="shooting-app"></div><script type="module" src="./src/ui/shooting-demo.js"></script></body>
</html>
