<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40K Tactics — Charge Phase</title>
<style>
:root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#0b0d10; color:#f2f3f5; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:#0b0d10; }
button,input { font:inherit; }
.charge-screen { max-width:980px; margin:0 auto; padding:24px 28px 32px; }
.charge-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; }
.charge-kicker { font-size:11px; letter-spacing:.14em; opacity:.55; }
h1 { margin:3px 0 2px; font-size:34px; }
.charge-header p { margin:0; opacity:.6; }
.charge-status { border:1px solid #353a42; border-radius:999px; padding:8px 12px; font-size:12px; }
.charge-note { margin:16px 0; padding:11px 13px; border-radius:10px; background:#14181d; color:#bfc5cd; font-size:12px; line-height:1.4; }
.charge-section { margin-top:18px; }
.charge-section__heading { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px; }
.charge-section__heading h2 { margin:0; font-size:16px; }
.charge-section__heading span { font-size:11px; opacity:.5; }
.charge-chargers { display:grid; grid-template-columns:repeat(3,minmax(150px,1fr)); gap:8px; }
.charge-charger { text-align:left; padding:12px; border:1px solid #343a43; border-radius:10px; background:#171b21; color:inherit; cursor:pointer; display:grid; gap:5px; min-height:74px; }
.charge-charger:hover,.charge-charger.is-selected { border-color:#8993a0; }
.charge-charger span { font-size:11px; opacity:.55; }
.charge-targets { display:grid; gap:7px; }
.charge-target { display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border:1px solid #2b3038; border-radius:9px; background:#111419; cursor:pointer; }
.charge-target--borderline { border-left:3px solid #8b755f; }
.charge-target input { margin-top:3px; }
.charge-target__main { display:grid; gap:3px; }
.charge-target__main > span { font-size:11px; opacity:.58; }
.charge-target__warning { opacity:.9 !important; }
.charge-actions { display:flex; gap:8px; margin-top:10px; }
.charge-actions button,.charge-footer button { min-height:40px; padding:0 14px; border:0; border-radius:8px; background:#e8ebef; color:#0b0d10; font-weight:700; cursor:pointer; }
.charge-actions button:disabled,.charge-footer button:disabled { opacity:.3; cursor:not-allowed; }
.charge-actions button:last-child { background:#252a31; color:#f2f3f5; border:1px solid #3b424c; }
.charge-history { list-style:none; padding:0; margin:0; display:grid; gap:5px; }
.charge-history__item { display:grid; gap:3px; padding:9px 10px; border:1px solid #272c33; border-radius:8px; background:#111419; }
.charge-history__item span,.charge-history__empty,.charge-empty { font-size:11px; opacity:.55; }
.charge-footer { margin-top:18px; display:flex; justify-content:flex-end; }
@media(max-width:700px){.charge-screen{padding:18px 14px 26px}.charge-header{flex-direction:column}.charge-chargers{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:460px){.charge-chargers{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="charge-app"></div>
<script type="module" src="./src/ui/charge-demo.js"></script>
</body>
</html>
