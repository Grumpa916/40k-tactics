<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40K Tactics — Integrated Battle</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    .battle-shell { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .battle-shell__header { margin-bottom: 12px; }
    .battle-shell__kicker { font-size: 11px; letter-spacing: .14em; opacity: .65; }
    .battle-shell__header h1 { margin: 4px 0; }
    .battle-shell__header p { margin: 0; opacity: .7; }
    .battle-shell__phases { display: flex; gap: 8px; padding: 0; margin: 0 0 16px; list-style: none; overflow-x: auto; }
    .battle-phase { min-width: 90px; padding: 9px 11px; border: 1px solid #444; border-radius: 8px; }
    .battle-phase { padding: 0; overflow: hidden; }
    .battle-phase__button { display:block; width:100%; min-height:58px; padding:9px 11px; border:0; background:transparent; color:inherit; text-align:left; font:inherit; cursor:pointer; }
    .battle-phase__button strong, .battle-phase__button span { display:block; }
    .battle-phase__button span { font-size:12px; opacity:.65; margin-top:2px; }
    .battle-phase__button:focus-visible { outline:2px solid #ddd; outline-offset:-3px; }
    .battle-phase.is-active { border-color:#aaa; background:#292929; }
    .battle-shell__view-note { margin:-6px 0 14px; font-size:13px; opacity:.7; }
    .movement-screen { max-width:1180px; margin:0 auto; padding:8px 0 24px; }
    .movement-screen header { display:flex; align-items:center; justify-content:space-between; gap:16px; background:#1a1a1a; border:1px solid #444; border-radius:12px; padding:18px 20px; margin-bottom:14px; }
    .movement-screen h1 { margin:4px 0; font-size:28px; }
    .movement-screen header p { margin:0; opacity:.7; }
    .movement-screen section { background:#191919; border:1px solid #444; border-radius:12px; padding:16px; margin-top:14px; }
    .movement-screen .move-kicker { font-size:11px; font-weight:800; letter-spacing:.12em; opacity:.65; }
    .movement-screen .move-note { background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:12px 14px; opacity:.85; font-size:14px; }
    .movement-screen .move-heading { display:flex; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .movement-screen .move-heading h2, .movement-screen .move-editor h2 { margin:0; font-size:18px; }
    .movement-screen .move-heading span, .movement-screen small { opacity:.7; font-size:12px; }
    .movement-screen .move-units { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
    .movement-screen .move-unit { display:flex; flex-direction:column; gap:5px; min-height:76px; text-align:left; padding:12px; border:1px solid #555; border-radius:9px; background:#222; color:inherit; cursor:pointer; }
    .movement-screen .move-unit.is-selected { border-color:#aaa; }
    .movement-screen .move-unit span, .movement-screen .move-unit small { opacity:.7; }
    .movement-screen .move-coordinate-list { display:grid; gap:10px; }
    .movement-screen .move-coordinate-row { display:grid; grid-template-columns:minmax(90px,1fr) repeat(2,minmax(70px,.6fr)) minmax(120px,1fr); align-items:center; gap:10px; padding:10px; border:1px solid #444; border-radius:8px; }
    .movement-screen .move-coordinate-row label { display:grid; gap:4px; font-size:12px; }
    .movement-screen input { min-width:0; width:100%; padding:9px; border:1px solid #555; border-radius:7px; background:#222; color:inherit; }
    .movement-screen .move-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .movement-screen button:disabled { opacity:.4; cursor:not-allowed; }
    .movement-screen .move-actions button { min-height:42px; padding:10px 14px; border:1px solid #555; border-radius:8px; background:#292929; color:inherit; font-weight:700; }
    .movement-screen .move-error { border:1px solid #b66; border-radius:8px; padding:10px; }
    @media (max-width:650px) { .movement-screen header { align-items:flex-start; flex-direction:column; } .movement-screen .move-coordinate-row { grid-template-columns:1fr 1fr; } .movement-screen .move-coordinate-row strong, .movement-screen .move-coordinate-row span { grid-column:1/-1; } }

    .command-screen { max-width:1180px; margin:0 auto; padding:8px 0 24px; }
    .command-screen header { display:flex; align-items:center; justify-content:space-between; gap:16px; background:#1a1a1a; border:1px solid #444; border-radius:12px; padding:18px 20px; margin-bottom:14px; }
    .command-screen h1 { margin:4px 0; font-size:28px; }
    .command-screen header p { margin:0; opacity:.7; }
    .command-screen section { background:#191919; border:1px solid #444; border-radius:12px; padding:16px; margin-top:14px; }
    .command-screen section h2 { margin:0 0 12px; font-size:18px; }
    .command-screen .command-kicker { font-size:11px; font-weight:800; letter-spacing:.12em; opacity:.65; }
    .command-screen .command-points { display:grid; gap:4px; text-align:right; }
    .command-screen .command-points span, .command-screen small { opacity:.7; font-size:12px; }
    .command-screen .command-points strong { font-size:30px; }
    .command-screen .command-note { background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:12px 14px; opacity:.85; font-size:14px; }
    .command-screen .command-ledger-actions { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
    .command-screen .command-ledger-actions button { border:1px solid #666; border-radius:8px; padding:10px 14px; background:#303030; color:#fff; font:inherit; font-weight:650; cursor:pointer; }
    .command-screen .command-ledger-actions button:focus-visible { outline:2px solid #ddd; outline-offset:2px; }
    .command-screen .command-ledger-history { margin:12px 0 0; padding-left:22px; display:grid; gap:7px; font-size:14px; }

    .command-screen .command-scoreboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0; }
    .command-screen .command-score-card { display:grid; gap:6px; padding:14px; border:1px solid #555; border-radius:9px; background:#222; }
    .command-screen .command-score-card span { font-size:13px; opacity:.75; }
    .command-screen .command-score-card strong { font-size:25px; }
    .command-screen .command-vp-form { display:grid; grid-template-columns:minmax(120px,.7fr) minmax(100px,.5fr) minmax(180px,1.5fr) auto; gap:10px; align-items:end; margin:14px 0; }
    .command-screen .command-vp-form label { display:grid; gap:5px; font-size:12px; font-weight:650; min-width:0; }
    .command-screen .command-vp-form input, .command-screen .command-vp-form select { width:100%; min-width:0; min-height:42px; padding:9px; border:1px solid #555; border-radius:8px; background:#222; color:inherit; font:inherit; }
    .command-screen .command-vp-form button { min-height:42px; padding:9px 13px; border:1px solid #777; border-radius:8px; background:#e8ebef; color:#111; font-weight:800; cursor:pointer; }
    .command-screen h3 { margin:18px 0 8px; font-size:15px; }
    @media(max-width:760px) { .command-screen .command-vp-form { grid-template-columns:1fr 1fr; } .command-screen .command-vp-form label:nth-child(3), .command-screen .command-vp-form button { grid-column:1/-1; } }

    .command-screen .command-objectives { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
    .command-screen .command-objective, .command-screen .command-scoring { display:grid; gap:8px; padding:12px; border:1px solid #444; border-radius:9px; background:#202020; }
    .command-screen .command-objective span, .command-screen .command-scoring span { opacity:.8; font-size:14px; }
    .command-screen .command-scoring ul { margin:0; padding-left:20px; font-size:13px; }
    .command-screen .command-scoring .is-available { color:#b9d8b9; }
    .command-screen .command-scoring .is-unavailable { color:#d4c3a1; }
    @media (max-width:650px) { .command-screen header { align-items:flex-start; flex-direction:column; } .command-screen .command-points { text-align:left; } }

    .battle-scoring-reminder__backdrop { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; padding:16px; background:rgba(0,0,0,.78); }
    .battle-scoring-reminder { width:min(100%,520px); max-height:min(85dvh,720px); overflow:auto; padding:22px; border:1px solid #777; border-radius:14px; background:#202020; color:#f5f5f5; box-shadow:0 18px 70px rgba(0,0,0,.65); }
    .battle-scoring-reminder h2 { margin:0 0 10px; font-size:23px; }
    .battle-scoring-reminder p { line-height:1.45; }
    .battle-scoring-reminder ul { padding-left:22px; line-height:1.5; }
    .battle-scoring-reminder__actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
    .battle-scoring-reminder__actions button { flex:1 1 160px; min-height:46px; padding:11px 14px; border:1px solid #777; border-radius:9px; background:#e8ebef; color:#111; font:inherit; font-weight:750; cursor:pointer; }
    .battle-scoring-reminder__actions button:last-child { background:#303030; color:#f5f5f5; }
    .battle-scoring-reminder__actions button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
    @media(max-width:480px) { .battle-scoring-reminder { padding:18px; } .battle-scoring-reminder__actions { flex-direction:column; } }
    .battle-shell__placeholder, .battle-startup-error { padding: 24px; border: 1px solid #777; border-radius: 10px; }
    .battle-startup-error { white-space: pre-wrap; overflow-wrap: anywhere; border-color: #b66; }

    * { box-sizing: border-box; }
    .shoot-screen { max-width: 1180px; margin: 0 auto; padding: 8px 0 24px; }
    .shoot-screen header, .shoot-screen .heading { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .shoot-screen header { background:#1a1a1a; border:1px solid #444; border-radius:12px; padding:18px 20px; margin-bottom:14px; }
    .shoot-screen h1 { margin:4px 0; font-size:28px; }
    .shoot-screen header p { margin:0; opacity:.7; }
    .shoot-screen .kicker { font-size:11px; font-weight:800; letter-spacing:.12em; opacity:.65; }
    .shoot-screen .note { background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:12px 14px; opacity:.85; font-size:14px; }
    .shoot-screen section { background:#191919; border:1px solid #444; border-radius:12px; padding:16px; margin-top:14px; min-width:0; }
    .shoot-screen .heading { margin-bottom:12px; }
    .shoot-screen .heading h2 { margin:0; font-size:16px; }
    .shoot-screen .heading span { font-size:12px; opacity:.7; }
    .shoot-screen .candidates { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .shoot-screen .shoot-unit { min-height:76px; text-align:left; padding:12px; border:1px solid #555; border-radius:9px; background:#222; color:inherit; cursor:pointer; }
    .shoot-screen .shoot-unit strong, .shoot-screen .shoot-unit span, .shoot-screen .shoot-unit small { display:block; }
    .shoot-screen .shoot-unit span, .shoot-screen .shoot-unit small { margin-top:4px; opacity:.7; font-size:12px; }
    .shoot-screen .grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:14px; align-items:start; }
    .shoot-screen .controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-items:end; }
    .shoot-screen .controls label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:650; min-width:0; }
    .shoot-screen .controls select, .shoot-screen .controls button { width:100%; margin:0; min-height:40px; padding:8px 10px; border:1px solid #555; border-radius:8px; background:#292929; color:inherit; }
    .shoot-screen .controls button { cursor:pointer; font-weight:700; }
    .shoot-screen .controls button:disabled { opacity:.4; cursor:not-allowed; }
    .shoot-screen .shoot-selected-shooter { grid-column:1 / -1; display:flex; flex-direction:column; gap:4px; padding:10px 12px; border:1px solid #444; border-radius:8px; background:#222; }
    .shoot-screen .shoot-selected-shooter span, .shoot-screen .damage-control__label { font-size:12px; opacity:.75; }
    .shoot-screen .damage-control { display:grid; gap:6px; }
    .shoot-screen .damage-control__buttons { display:grid; grid-template-columns:44px minmax(44px,1fr) 44px; min-height:40px; }
    .shoot-screen .damage-control__buttons button { min-height:40px; padding:0; font-size:20px; }
    .shoot-screen .damage-control__buttons strong { display:grid; place-items:center; border-top:1px solid #555; border-bottom:1px solid #555; background:#222; }
    .shoot-screen .damage-control small { display:none; }
    .shoot-screen .shoot-advisory { grid-column:1 / -1; padding:14px; border:1px solid #555; border-radius:10px; background:#202020; }
    .shoot-screen .shoot-advisory__heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .shoot-screen .shoot-advisory__heading h3 { margin:0; font-size:18px; }
    .shoot-screen .shoot-advisory__heading span { font-size:13px; opacity:.8; }
    .shoot-screen .shoot-advisory__grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
    .shoot-screen .shoot-advisory__grid > div { display:flex; flex-direction:column; gap:5px; padding:10px; border:1px solid #444; border-radius:8px; }
    .shoot-screen .shoot-advisory__grid strong { font-size:18px; }
    .shoot-screen .shoot-advisory__grid span { font-size:12px; opacity:.75; }
    .shoot-screen .shoot-advisory p { margin:12px 0 8px; }
    .shoot-screen .shoot-advisory small { opacity:.75; }
    .shoot-screen .history { margin:0; padding-left:24px; }
    .shoot-screen .history li { padding:7px 0; }
    .shoot-screen .history li span { display:block; margin-top:4px; opacity:.75; }
    .shoot-screen .choice { margin-top:12px; padding:12px; border:1px solid #444; border-radius:9px; background:#222; display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .shoot-screen .choice>div:first-child span { display:block; margin-top:4px; opacity:.75; font-size:12px; }
    .shoot-screen .choice-buttons { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .shoot-screen .choice-buttons button, .shoot-screen .choice-buttons select { min-height:40px; padding:0 10px; border:1px solid #555; border-radius:8px; background:#292929; color:inherit; }
    .shoot-screen .choice-buttons label { font-size:12px; }
    .shoot-screen footer { display:flex; justify-content:flex-end; padding:16px 0; }
    .shoot-screen .complete { min-height:40px; padding:0 16px; border:0; border-radius:8px; background:#e8ebef; color:#0b0d10; font-weight:800; }
    @media(max-width:800px) { .shoot-screen .grid { grid-template-columns:1fr; } .shoot-screen .candidates { grid-template-columns:repeat(2,minmax(0,1fr)); } .shoot-screen .choice { align-items:flex-start; flex-direction:column; } }
    @media(max-width:520px) { .shoot-screen .candidates, .shoot-screen .controls { grid-template-columns:1fr; } .shoot-screen header { align-items:flex-start; flex-direction:column; } .shoot-screen .shoot-selected-shooter, .shoot-screen .shoot-advisory { grid-column:auto; } }
  </style>
</head>
<body>
  <div id="battle-app"><main class="battle-shell"><h1>Loading integrated battle…</h1><p>Starting the phase screens.</p></main></div>
  <script type="module">
    import("./src/ui/battle-demo.js").catch((error) => {
      const root = document.getElementById("battle-app");
      root.innerHTML = "<main class=\"battle-shell\"><h1>Battle preview failed to start</h1><section class=\"battle-startup-error\"><strong>Startup error</strong><pre></pre></section><p>Reload after the fix is published.</p></main>";
      root.querySelector("pre").textContent = error?.stack || error?.message || String(error);
    });
  </script>
</body>
</html>
