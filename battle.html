<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40K Tactics — Integrated Battle</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    .battle-shell { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .battle-shell__header { margin-bottom: 12px; }
    .battle-shell__kicker { font-size: 11px; letter-spacing: .14em; opacity: .65; }
    .battle-shell__header h1 { margin: 4px 0; }
    .battle-shell__header p { margin: 0; opacity: .7; }
    .battle-shell__phases { display: flex; gap: 8px; padding: 0; margin: 0 0 16px; list-style: none; overflow-x: auto; }
    .battle-phase { min-width: 90px; padding: 9px 11px; border: 1px solid #444; border-radius: 8px; }
    .battle-phase { padding: 0; overflow: hidden; }
    .battle-phase__button { display:block; width:100%; min-height:58px; padding:9px 11px; border:0; background:transparent; color:inherit; text-align:left; font:inherit; cursor:pointer; }
    .battle-phase__button strong, .battle-phase__button span { display:block; }
    .battle-phase__button span { font-size:12px; opacity:.65; margin-top:2px; }
    .battle-phase__button:focus-visible { outline:2px solid #ddd; outline-offset:-3px; }
    .battle-phase.is-active { border-color:#aaa; background:#292929; }
    .battle-shell__view-note { margin:-6px 0 14px; font-size:13px; opacity:.7; }

    .battle-shell { max-width: 1600px; }
    .battle-shell__status-summary { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 12px; padding:10px 12px; border:1px solid #424954; border-radius:10px; background:#171c24; }
    .battle-shell__round-summary { display:flex; flex-direction:column; gap:3px; }
    .battle-shell__round-summary strong { font-size:15px; }
    .battle-shell__round-summary span { font-size:12px; opacity:.72; }
    .battle-shell__player-summaries { display:flex; flex-wrap:wrap; gap:8px; }
    .battle-shell__player-summary { display:flex; align-items:center; gap:10px; padding:7px 10px; border:1px solid #414956; border-radius:8px; background:#202631; font-size:13px; }
    .battle-shell__player-summary strong { max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .battle-shell__player-summary span { white-space:nowrap; opacity:.86; }
    .battle-shell__player-summary.is-active { border-color:#b18bd8; box-shadow:inset 0 0 0 1px #76559b; }
    .battle-shell__workspace { display:grid; grid-template-columns:minmax(190px,.78fr) minmax(0,2fr) minmax(220px,.92fr); gap:12px; align-items:start; }
    .battle-shell__workspace[data-left-collapsed="true"] { grid-template-columns:44px minmax(0,2fr) minmax(220px,.92fr); }
    .battle-shell__workspace[data-right-collapsed="true"] { grid-template-columns:minmax(190px,.78fr) minmax(0,2fr) 44px; }
    .battle-shell__workspace[data-left-collapsed="true"][data-right-collapsed="true"] { grid-template-columns:44px minmax(0,1fr) 44px; }
    .battle-shell__side-panel { min-width:0; padding:8px; border:1px solid #424954; border-radius:10px; background:#151a22; }
    .battle-shell__panel-toggle { display:flex; align-items:center; justify-content:center; width:100%; min-width:0; min-height:44px; padding:9px 8px; border:1px solid #434b59; border-radius:7px; background:#202631; color:inherit; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; }
    .battle-shell__panel-toggle:focus-visible { outline:2px solid #c5a2ed; outline-offset:2px; }
    .battle-shell__panel-body { min-width:0; }
    .battle-shell__workspace[data-left-collapsed="true"] .battle-shell__side-panel--left .battle-shell__panel-body,
    .battle-shell__workspace[data-right-collapsed="true"] .battle-shell__side-panel--right .battle-shell__panel-body { display:none; }
    .battle-shell__workspace[data-left-collapsed="true"] .battle-shell__side-panel--left,
    .battle-shell__workspace[data-right-collapsed="true"] .battle-shell__side-panel--right { padding:3px; }
    .battle-shell__workspace[data-left-collapsed="true"] .battle-shell__side-panel--left .battle-shell__panel-toggle span,
    .battle-shell__workspace[data-right-collapsed="true"] .battle-shell__side-panel--right .battle-shell__panel-toggle span { writing-mode:vertical-rl; font-size:11px; line-height:1.25; }
    .battle-shell__content { min-width:0; }
    .battle-shell__army-dock { position:sticky; bottom:0; z-index:40; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:14px -4px -8px; padding:8px; border:1px solid #424954; border-radius:10px 10px 0 0; background:rgba(16,20,27,.96); backdrop-filter:blur(10px); }
    .battle-shell__army-dock button { display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0; min-height:48px; padding:9px 12px; border:1px solid #424954; border-radius:8px; background:#202631; color:inherit; font:inherit; text-align:left; cursor:pointer; touch-action:manipulation; }
    .battle-shell__army-dock button:disabled { opacity:.45; cursor:not-allowed; }
    .battle-shell__army-dock button span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; opacity:.72; }
    .battle-shell__army-overlay { position:fixed; inset:0; z-index:1200; display:grid; place-items:center; padding:16px; background:rgba(0,0,0,.78); }
    .battle-shell__army-overlay[hidden] { display:none; }
    .battle-shell__army-dialog { width:min(100%,620px); max-height:85dvh; overflow:auto; padding:18px; border:1px solid #697386; border-radius:12px; background:#1b222d; color:#f2f4f8; box-shadow:0 18px 60px rgba(0,0,0,.55); }
    .battle-shell__army-dialog-header { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid #3c4553; padding-bottom:10px; }
    .battle-shell__army-dialog-header h2 { margin:0; font-size:20px; }
    .battle-shell__army-dialog button { min-height:44px; padding:8px 12px; border:1px solid #697386; border-radius:8px; background:#2a3340; color:inherit; font:inherit; font-weight:700; cursor:pointer; }
    .battle-shell__army-roster { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:8px; }
    .battle-shell__army-roster li { display:grid; gap:5px; padding:10px; border:1px solid #3c4553; border-radius:8px; background:#202733; }
    .battle-shell__army-roster li span, .battle-shell__army-roster li small { font-size:12px; opacity:.78; }
    .battle-context__section { min-width:0; margin:8px 0; padding:10px; border:1px solid #363f4c; border-radius:8px; background:#191f29; }
    .battle-context__section > summary, .battle-context__reference-section > summary { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:38px; cursor:pointer; font-weight:750; list-style-position:inside; }
    .battle-context__count { flex:none; font-size:11px; opacity:.7; font-weight:600; }
    .battle-context__unit-list, .battle-context__event-list, .battle-context__reference-list { margin:8px 0 0; padding:0; list-style:none; display:grid; gap:7px; }
    .battle-context__unit { display:grid; gap:5px; padding:9px; border:1px solid #394352; border-radius:7px; background:#202733; }
    .battle-context__unit-heading { display:flex; flex-direction:column; gap:2px; }
    .battle-context__unit-heading small, .battle-context__event small, .battle-context__unit-meta, .battle-context__note { font-size:12px; opacity:.72; }
    .battle-context__badges { display:flex; flex-wrap:wrap; gap:4px; }
    .battle-context__badge { display:inline-block; padding:2px 5px; border:1px solid #5d6675; border-radius:4px; font-size:10px; line-height:1.3; }
    .battle-context__badge--danger { border-color:#a65c65; color:#ffb5bb; }
    .battle-context__badge--warning { border-color:#a7834d; color:#ffd9a0; }
    .battle-context__badge--muted { opacity:.68; }
    .battle-context__alert { padding:7px 8px; border-left:3px solid #d1a15d; background:#30291f; font-size:12px; }
    .battle-context__test-controls { display:grid; gap:6px; padding-top:4px; font-size:11px; opacity:.9; }
    .battle-context__test-controls > div { display:flex; gap:6px; }
    .battle-context__test-controls button { flex:1; min-height:40px; padding:6px 8px; border:1px solid #667487; border-radius:6px; background:#27313f; color:inherit; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; }
    .battle-context__test-controls button:focus-visible { outline:2px solid #c5a2ed; outline-offset:2px; }
    .battle-context__event { display:grid; gap:4px; padding:8px 0 8px 9px; border-left:2px solid #626c7b; border-bottom:1px solid #2f3743; font-size:12px; }
    .battle-context__event:nth-child(2n) { border-left-color:#8f70b5; }
    .battle-context__event span { line-height:1.35; overflow-wrap:anywhere; }
    .battle-context__message { padding:8px; border:1px solid #647e68; border-radius:7px; background:#1d3024; font-size:12px; }
    .battle-context__references { min-width:0; }
    .battle-context__section-heading { margin:4px 0 8px; font-size:15px; }
    .battle-context__reference-section { margin:7px 0; padding:7px 9px; border:1px solid #343d49; border-radius:7px; background:#1a2029; }
    .battle-context__reference-section > summary { min-height:38px; }
    .battle-context__reference-group { margin:7px 0 10px; }
    .battle-context__reference-group h3 { margin:6px 0; font-size:12px; opacity:.83; }
    .battle-context__reference-list li { display:grid; gap:4px; padding:7px; border:1px solid #353e4a; border-radius:6px; background:#202733; font-size:12px; }
    .battle-context__reference-list li > span { font-size:11px; opacity:.72; line-height:1.35; }
    .battle-context__reference-title { display:flex; align-items:center; flex-wrap:wrap; gap:5px; }
    .battle-context__reference-title strong { overflow-wrap:anywhere; }
    .battle-context__empty { font-size:12px; opacity:.68; }
    .battle-shell__clock-button { display:flex; align-items:center; gap:8px; min-height:44px; padding:8px 12px; border:1px solid #8d6bb1; border-radius:8px; background:#2b2037; color:inherit; font:inherit; font-weight:800; cursor:pointer; touch-action:manipulation; }
    .battle-shell__clock-button time { font-variant-numeric:tabular-nums; opacity:.9; }
    .battle-shell__clock-panel { position:fixed; top:12vh; right:16px; z-index:1100; width:min(360px,calc(100vw - 24px)); max-height:76dvh; overflow:auto; padding:16px; border:1px solid #697386; border-radius:12px; background:#1b222d; color:#f2f4f8; box-shadow:0 18px 60px rgba(0,0,0,.55); }
    .battle-shell__clock-panel[hidden] { display:none; }
    .battle-shell__clock-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:1px solid #3c4553; padding-bottom:10px; }
    .battle-shell__clock-header h2 { margin:0 0 4px; font-size:18px; }
    .battle-shell__clock-header p, .battle-shell__clock-note { margin:0; font-size:12px; line-height:1.4; opacity:.75; }
    .battle-shell__clock-panel button { min-height:44px; padding:9px 12px; border:1px solid #697386; border-radius:8px; background:#2a3340; color:inherit; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; }
    .battle-shell__clock-list { list-style:none; margin:12px 0; padding:0; display:grid; gap:8px; }
    .battle-shell__clock-player { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px; border:1px solid #3c4553; border-radius:8px; background:#202733; }
    .battle-shell__clock-player.is-clock-owner { border-color:#9c7bc2; box-shadow:inset 0 0 0 1px #70558d; }
    .battle-shell__clock-player div { display:grid; gap:3px; min-width:0; }
    .battle-shell__clock-player small { font-size:11px; opacity:.72; }
    .battle-shell__clock-player time { font-size:22px; font-variant-numeric:tabular-nums; font-weight:800; white-space:nowrap; }
    .battle-shell__clock-actions { margin:10px 0; display:flex; justify-content:flex-end; }
    .battle-shell__clock-actions button { min-width:130px; }
    .battle-shell__clock-actions button:disabled { opacity:.45; cursor:not-allowed; }
    .battle-shell__clock-message { padding:8px; border:1px solid #a65c65; border-radius:7px; font-size:12px; }
    .battle-shell__clock-note { margin-top:8px; }
    .battle-mission-summary { display:grid; gap:8px; margin:12px 0 8px; min-width:0; }
    .battle-mission-summary__section { min-width:0; border:1px solid #3b4553; border-radius:9px; background:#171d26; padding:8px 11px; }
    .battle-mission-summary__section > summary { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:42px; cursor:pointer; font-weight:800; list-style-position:inside; }
    .battle-mission-summary__section > summary > span:first-child { font-size:14px; letter-spacing:.02em; }
    .battle-mission-summary__section-content { display:grid; gap:8px; padding:6px 0 2px; }
    .battle-mission-summary__player { min-width:0; border:1px solid #374150; border-radius:7px; background:#202733; }
    .battle-mission-summary__player > summary { display:flex; align-items:center; gap:8px; min-height:42px; padding:8px 10px; cursor:pointer; list-style-position:inside; }
    .battle-mission-summary__player > summary > span:first-child { flex:0 0 66px; font-size:11px; font-weight:850; text-transform:uppercase; opacity:.82; }
    .battle-mission-summary__player > summary > strong { flex:1; min-width:0; overflow-wrap:anywhere; font-size:13px; }
    .battle-mission-summary__detail { padding:0 12px 12px 26px; color:inherit; font-size:12px; line-height:1.45; }
    .battle-mission-summary__detail p { margin:5px 0; opacity:.86; }
    .battle-mission-summary__detail ul { margin:7px 0; padding-left:18px; }
    .battle-mission-summary__card { margin:6px 0; border:1px solid #3c4654; border-radius:6px; background:#151b24; }
    .battle-mission-summary__card > summary { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:42px; padding:8px 10px; cursor:pointer; font-weight:750; overflow-wrap:anywhere; }
    .battle-mission-summary__card > summary::marker { color:#ac85d2; }
    @media(max-width:1050px) {
      .battle-shell__workspace { grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(190px,1fr); }
      .battle-shell__workspace[data-left-collapsed="true"] { grid-template-columns:44px minmax(0,2fr) minmax(190px,1fr); }
      .battle-shell__workspace[data-right-collapsed="true"] { grid-template-columns:minmax(0,1fr) minmax(0,2fr) 44px; }
      .battle-shell__workspace[data-left-collapsed="true"][data-right-collapsed="true"] { grid-template-columns:44px minmax(0,1fr) 44px; }
    }
    @media(max-width:760px) {
      .battle-shell__workspace, .battle-shell__workspace[data-left-collapsed="true"],
      .battle-shell__workspace[data-right-collapsed="true"],
      .battle-shell__workspace[data-left-collapsed="true"][data-right-collapsed="true"] { grid-template-columns:minmax(0,1fr); }
      .battle-shell__workspace[data-left-collapsed="true"] .battle-shell__side-panel--left,
      .battle-shell__workspace[data-right-collapsed="true"] .battle-shell__side-panel--right { padding:8px; }
      .battle-shell__workspace[data-left-collapsed="true"] .battle-shell__side-panel--left .battle-shell__panel-toggle span,
      .battle-shell__workspace[data-right-collapsed="true"] .battle-shell__side-panel--right .battle-shell__panel-toggle span { writing-mode:initial; }
      .battle-shell__player-summary { flex:1 1 125px; }
      .battle-shell__army-dock button { flex-direction:column; align-items:flex-start; justify-content:center; gap:3px; }
      .battle-shell__view-note { margin-top:0; }
    }

    .movement-screen { max-width:1180px; margin:0 auto; padding:8px 0 24px; }
    .movement-screen header { display:flex; align-items:center; justify-content:space-between; gap:16px; background:#1a1a1a; border:1px solid #444; border-radius:12px; padding:18px 20px; margin-bottom:14px; }
    .movement-screen h1 { margin:4px 0; font-size:28px; }
    .movement-screen header p { margin:0; opacity:.7; }
    .movement-screen section { background:#191919; border:1px solid #444; border-radius:12px; padding:16px; margin-top:14px; }
    .movement-screen .move-kicker { font-size:11px; font-weight:800; letter-spacing:.12em; opacity:.65; }
    .movement-screen .move-note { background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:12px 14px; opacity:.85; font-size:14px; }
    .movement-screen .move-heading { display:flex; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .movement-screen .move-heading h2, .movement-screen .move-editor h2 { margin:0; font-size:18px; }
    .movement-screen .move-heading span, .movement-screen small { opacity:.7; font-size:12px; }
    .movement-screen .move-units { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
    .movement-screen .move-unit { display:flex; flex-direction:column; gap:5px; min-height:76px; text-align:left; padding:12px; border:1px solid #555; border-radius:9px; background:#222; color:inherit; cursor:pointer; }
    .movement-screen .move-unit.is-selected { border-color:#aaa; }
    .movement-screen .move-unit span, .movement-screen .move-unit small { opacity:.7; }
    .movement-screen .move-coordinate-list { display:grid; gap:10px; }
    .movement-screen .move-coordinate-row { display:grid; grid-template-columns:minmax(90px,1fr) repeat(2,minmax(70px,.6fr)) minmax(120px,1fr); align-items:center; gap:10px; padding:10px; border:1px solid #444; border-radius:8px; }
    .movement-screen .move-coordinate-row label { display:grid; gap:4px; font-size:12px; }
    .movement-screen input { min-width:0; width:100%; padding:9px; border:1px solid #555; border-radius:7px; background:#222; color:inherit; }
    .movement-screen .move-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .movement-screen button:disabled { opacity:.4; cursor:not-allowed; }
    .movement-screen .move-actions button { min-height:42px; padding:10px 14px; border:1px solid #555; border-radius:8px; background:#292929; color:inherit; font-weight:700; }
    .movement-screen .move-error { border:1px solid #b66; border-radius:8px; padding:10px; }
    @media (max-width:650px) { .movement-screen header { align-items:flex-start; flex-direction:column; } .movement-screen .move-coordinate-row { grid-template-columns:1fr 1fr; } .movement-screen .move-coordinate-row strong, .movement-screen .move-coordinate-row span { grid-column:1/-1; } }

    .battle-setup-screen .event-companion-disposition-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:14px 0; }
    .battle-setup-screen .event-companion-disposition-group { min-width:0; margin:0; padding:12px; border:1px solid #555; border-radius:10px; }
    .battle-setup-screen .event-companion-disposition-group legend { padding:0 6px; font-weight:750; }
    .battle-setup-screen .event-companion-disposition-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .battle-setup-screen .event-companion-disposition-options button { min-width:0; min-height:48px; padding:10px; border:1px solid #666; border-radius:8px; background:#292929; color:inherit; font:inherit; font-weight:700; text-align:center; cursor:pointer; touch-action:manipulation; }
    .battle-setup-screen .event-companion-disposition-options button[aria-pressed="true"] { border-color:#c9e4c8; background:#25452b; box-shadow:inset 0 0 0 1px #c9e4c8; }
    .battle-setup-screen .event-companion-disposition-options button:disabled { opacity:.4; cursor:not-allowed; }
    .battle-setup-screen .event-companion-disposition-options button:focus-visible { outline:2px solid #eee; outline-offset:2px; }
    @media(max-width:650px) { .battle-setup-screen .event-companion-disposition-groups { grid-template-columns:1fr; } }
    .command-screen { max-width:1180px; margin:0 auto; padding:8px 0 24px; }
    .command-screen header { display:flex; align-items:center; justify-content:space-between; gap:16px; background:#1a1a1a; border:1px solid #444; border-radius:12px; padding:18px 20px; margin-bottom:14px; }
    .command-screen h1 { margin:4px 0; font-size:28px; }
    .command-screen header p { margin:0; opacity:.7; }
    .command-screen section { background:#191919; border:1px solid #444; border-radius:12px; padding:16px; margin-top:14px; }
    .command-screen section h2 { margin:0 0 12px; font-size:18px; }
    .command-screen .command-kicker { font-size:11px; font-weight:800; letter-spacing:.12em; opacity:.65; }
    .command-screen .command-points { display:grid; gap:4px; text-align:right; }
    .command-screen .command-points span, .command-screen small { opacity:.7; font-size:12px; }
    .command-screen .command-points strong { font-size:30px; }
    .command-screen .command-note { background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:12px 14px; opacity:.85; font-size:14px; }
    .command-screen .command-ledger-actions { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
    .command-screen .command-ledger-actions button { border:1px solid #666; border-radius:8px; padding:10px 14px; background:#303030; color:#fff; font:inherit; font-weight:650; cursor:pointer; }
    .command-screen .command-ledger-actions button:focus-visible { outline:2px solid #ddd; outline-offset:2px; }
    .command-screen .command-ledger-history { margin:12px 0 0; padding-left:22px; display:grid; gap:7px; font-size:14px; }

    .command-screen .command-scoreboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0; }
    .command-screen .command-score-card { display:grid; gap:6px; padding:14px; border:1px solid #555; border-radius:9px; background:#222; }
    .command-screen .command-score-card span { font-size:13px; opacity:.75; }
    .command-screen .command-score-card strong { font-size:25px; }
    .command-screen .command-vp-form { display:grid; grid-template-columns:minmax(120px,.7fr) minmax(100px,.5fr) minmax(180px,1.5fr) auto; gap:10px; align-items:end; margin:14px 0; }
