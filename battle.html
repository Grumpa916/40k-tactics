<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40K Tactics — Integrated Battle</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    .battle-shell { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .battle-shell__header { margin-bottom: 12px; }
    .battle-shell__header h1 { margin: 4px 0; }
    .battle-shell__header p { margin: 0; opacity: .7; }
    .battle-shell__phases { display: flex; gap: 8px; padding: 0; margin: 0 0 16px; list-style: none; overflow-x: auto; }
    .battle-phase { min-width: 90px; padding: 9px 11px; border: 1px solid #444; border-radius: 8px; }
    .battle-phase strong, .battle-phase span { display: block; }
    .battle-phase span { font-size: 12px; opacity: .65; margin-top: 2px; }
    .battle-phase.is-active { border-color: #aaa; }
    .battle-shell__placeholder { padding: 24px; border: 1px solid #777; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="battle-app"><main class="battle-shell"><h1>Loading integrated battle…</h1><p>Starting the phase screens.</p></main></div>
  <script>
    const root = document.getElementById("battle-app");
    function showStartupError(message) {
      root.innerHTML = "";
      const main = document.createElement("main");
      main.className = "battle-shell";
      const heading = document.createElement("h1");
      heading.textContent = "Battle module startup diagnostic";
      const detail = document.createElement("pre");
      detail.style.whiteSpace = "pre-wrap";
      detail.style.overflowWrap = "anywhere";
      detail.textContent = message;
      main.append(heading, detail);
      root.append(main);
    }
    window.addEventListener("error", (event) => {
      if (event.message || event.filename) showStartupError("JavaScript error: " + (event.message || "module load failed") + (event.filename ? "\\nFile: " + event.filename : "") + (event.lineno ? "\\nLine: " + event.lineno : ""));
    });
    window.addEventListener("unhandledrejection", (event) => {
      showStartupError("Unhandled module rejection: " + (event.reason?.stack || event.reason?.message || String(event.reason)));
    });
    window.setTimeout(() => {
      if (root.textContent.includes("Loading integrated battle")) showStartupError("No JavaScript render or error event was received within 4 seconds. The preview may be blocking module scripts or the module request may not be reaching the browser.");
    }, 4000);
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/gh/Grumpa916/40k-tactics@main/src/ui/battle-demo.js" onerror="document.getElementById('battle-app').innerHTML='<main class=&quot;battle-shell&quot;><h1>Entry module request failed</h1><p>The browser could not load the JavaScript entry file from the CDN.</p></main>'"></script>
</body>
</html>
