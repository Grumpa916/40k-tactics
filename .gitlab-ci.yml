image: node:22

stages:
  - update

apply_shooting_saved_roster_fix:
  stage: update
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - git apply --check shooting-saved-roster-fix.patch
    - git apply shooting-saved-roster-fix.patch
    - npm test
    - npm run build
    - npx --yes wrangler@latest pages deploy dist --project-name=40k-tactics --branch="$CI_COMMIT_BRANCH"
    - cp gitlab-ci-production.yml .gitlab-ci.yml
    - rm shooting-saved-roster-fix.patch gitlab-ci-production.yml
    - git config user.name '40K Tactics Update'
    - git config user.email 'update-bot@users.noreply.gitlab.com'
    - git add -A
    - git commit -m 'Restore saved-roster Shooting weapon selection'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}"
