image: node:20

stages:
  - update
  - test
  - build
  - deploy

apply_queued_update:
  image: node:22
  stage: update
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - pending-update.patch
    - when: never
  script:
    - git apply --check pending-update.patch
    - git apply pending-update.patch
    - npm test
    - npm run build
    - npx --yes wrangler@latest pages deploy dist --project-name=40k-tactics --branch="$CI_COMMIT_BRANCH"
    - rm pending-update.patch
    - git config user.name '40K Tactics Update'
    - git config user.email 'update-bot@users.noreply.gitlab.com'
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo 'No source changes remain after applying the queued update.'
        exit 1
      fi
    - git commit -m 'Apply queued 40K Tactics update'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}"

test:
  stage: test
  rules:
    - exists:
        - pending-update.patch
      when: never
    - when: on_success
  script:
    - npm test

build:
  stage: build
  rules:
    - exists:
        - pending-update.patch
      when: never
    - when: on_success
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

deploy_cloudflare:
  image: node:22
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - exists:
        - pending-update.patch
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npx --yes wrangler@latest pages deploy dist --project-name=40k-tactics --branch="$CI_COMMIT_BRANCH"
