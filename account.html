<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>40K Tactics — Account Recovery</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#0b0d10; color:#f2f3f5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
    main { width:min(100%,480px); padding:28px; border:1px solid #343a43; border-radius:16px; background:#14181d; }
    h1 { margin-top:0; font-size:26px; }
    p { color:#bfc5cd; line-height:1.5; }
    form { display:grid; gap:9px; margin:20px 0; }
    label { font-size:14px; }
    input,button { min-height:44px; width:100%; padding:10px 12px; border-radius:8px; font:inherit; }
    input { border:1px solid #454c56; background:#0b0d10; color:inherit; }
    button { border:0; background:#e8ebef; color:#0b0d10; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; }
    [role=status] { overflow-wrap:anywhere; }
    .success { color:#a9e6bd; }
    a { color:#b8d0ff; }
  </style>
</head>
<body>
  <main data-account-root aria-live="polite">
    <h1>Account recovery</h1>
    <p>Loading account recovery…</p>
  </main>
  <script type="module" src="./src/account-recovery.js"></script>
</body>
</html>
